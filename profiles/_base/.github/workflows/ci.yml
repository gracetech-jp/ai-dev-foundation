name: CI

# 共通の品質ゲートは基盤の reusable workflow が持つ（ADR-011 の三層構成の最上層）。
# **このファイルに書くのは「どのスタックか」だけ**にする——ゲートの実装（req-coverage /
# tier-tripwire / audit-all / secret-scan）、soft/hard の判定、側置きチェックアウトは基盤側にあり、
# 基盤を直せば全プロジェクトへ伝播する。ここへ手順を書き足すと、その分だけ伝播しなくなる。
#
# 【CI では devcontainer をビルドしない】（ADR-011・2026-08-04 決定）
# 毎 push のイメージビルドが重く、CI の単独チェックアウトでは bind 元が無くて起動しない。
# 環境一致は「CI とローカルが同じ make ターゲットを呼ぶ」ことで担保する。
#
# 【ローカルで CI を再現したいとき】
# 基盤リポの配下（projects/<name>）に居れば、CI と同じ入口を叩ける:
#   make audit-all req-coverage tier-tripwire   # 共通ゲート
#   make lint test coverage audit-deps          # スタックゲート

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # **ジョブ id を変えないこと。** チェック名は `<このジョブ id> / <reusable 側のジョブ名>` で、
  # ブランチ保護の必須チェックはその名前で登録する。変えると「報告されないチェックを待ち続ける」
  # 状態になり PR が永久に止まる。変えるなら .github/required-checks.txt も同時に直す。
  ci:
    uses: gracetech-jp/ai-dev-foundation/.github/workflows/service-ci.yml@v2
    with:
      project-name: SERVICE_NAME

      # **`uses:` のタグと同じ値を書く。** 省くと共通基盤の checkout が既定ブランチへ落ち、
      # タグでピン止めしても main のゲートで回る（`github.job_workflow_sha` は空。2026-08-06 実測）。
      # ずれても赤くならない（違うのは「どの版のゲートで検査したか」だけ）ので、
      # 一致は監査が機械で見る。片方だけ上げないこと。
      foundation-ref: v2

      # 共通ゲート（すべて hard）。基盤が実装し、基盤の変更が全プロジェクトへ伝播する。
      # ここから消すとそのゲートは走らなくなる＝**緑の意味が変わる**ので、消すなら理由を残すこと。
      common-gates: "audit-all req-coverage tier-tripwire"

      # ---- ここから下はサービスが自分のスタックに合わせて書き換える ----
      # runtime: none | node | python | both
      runtime: none
      # 依存導入に使うもの: pnpm | npm | uv | poetry（空なら導入しない）
      package-manager: ""
      # スタックゲート。未実装のうちは TODO 契約（exit 3）で soft、実装した時点で自動的に red 化する。
      # 実装は Makefile 側にあり、CI とローカルで同じ入口を通る。
      stack-gates: "lint test coverage audit-deps"
      # DB が要るなら postgres（reusable 側で services: 付きのジョブに切り替わる）
      db: none
