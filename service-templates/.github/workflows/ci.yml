name: CI

# 参照方式（2026-07-26 フェーズ1〜）の CI。
#
# 【重要な前提】CI はこのリポジトリを**単独で** checkout する。共通基盤リポジトリは存在しない。
# そのため:
#   - 共通ゲート（req-coverage / tier-tripwire / coverage-floor）は**composite action** で呼ぶ。
#     action は自分のディレクトリにスクリプトを同梱しているため、共通リポの追加 checkout も
#     トークンも不要（$GITHUB_ACTION_PATH から実行される）。
#   - **make は使えない**。Makefile が共通基盤のマーカーを要求して fail-closed で止まるため。
#     make は「共通基盤が見えるローカル・pre-push」の入口であり、CI ではスタックの
#     コマンドを直接呼ぶ。ゲートの中身は同じスクリプトなので二重化は成立する。
#
# 前提設定: 共通リポジトリの Settings → Actions → General → Access で
#           「Accessible from repositories in the organization」を有効にすること。
#           これが無いと private リポジトリの action を解決できない。

on:
  push:
  pull_request:

permissions:
  contents: read

# 共通 action のバージョンは固定する（タグを動かすと全プロジェクトが同時に影響を受けるため）。
env:
  FOUNDATION_REF: v1

jobs:
  # ---- スタック依存のゲート（このサービスが実装する） ----
  stack-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # TODO: このサービスのランタイム設定（例: actions/setup-node / setup-python）
      # TODO: 依存導入（例: pnpm install --frozen-lockfile / uv sync）
      - name: lint
        run: echo "TODO: このサービスの静的解析コマンドを設定してください"
      - name: test
        run: echo "TODO: このサービスのテストコマンドを設定してください"
      - name: 依存監査
        run: echo "TODO: このサービスの依存監査コマンドを設定してください"

  # ---- 共通ゲート（composite action。スクリプトは action に同梱） ----
  req-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gracetech-jp/ai-dev-foundation/.github/actions/req-coverage@v1
        with:
          test-paths: "tests"
          req-marker-re: '@req:?[[:space:]]*R-[0-9]+'
          adv-marker-re: '@adversarial:?[[:space:]]*R-[0-9]+'

  tier-tripwire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 差分基準（origin/main）に全履歴が必要
      - uses: gracetech-jp/ai-dev-foundation/.github/actions/tier-tripwire@v1
        with:
          # PROJECT.md「Tierトリップワイヤ設定」と Makefile の値を一致させること。
          # 機微面が無い場合は空のまま docs/requirements/.tier-tripwire-none をコミットする。
          sensitive-paths: ""
          sensitive-symbols: ""

  # カバレッジのフロア検証。計測はスタック側の責務なので、計測値を渡して比較だけさせる。
  # 計測を実装するまではこのジョブをコメントアウトのままにしないこと（黙って緑になるため）。
  coverage-floor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # TODO: 計測して $GITHUB_OUTPUT に出す（例: id: cov で pct を出力）
      - name: 計測（未実装）
        id: cov
        run: echo "pct=0" >> "$GITHUB_OUTPUT"
      - uses: gracetech-jp/ai-dev-foundation/.github/actions/coverage-floor@v1
        with:
          measured: ${{ steps.cov.outputs.pct }}

  # ---- 整合性監査（このリポジトリ内で完結。純 bash/grep のため素の runner） ----
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/audit-consistency.sh

  # ---- 秘密のコミット防止（security.md。スタック非依存） ----
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: gitleaks (working tree)
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.18.4 detect --source=/repo --no-git --redact --no-banner
