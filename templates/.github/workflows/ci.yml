name: CI

# スタック非依存の品質ゲート（docs/rules/quality-gates.md §4「CI 多段ゲート」）。
# 各ジョブは make ターゲットだけを呼び、言語固有コマンドは一切書かない（中身は Makefile が委譲）。
# lint / test はサービスの devcontainer（.devcontainer/Dockerfile）内で実行し、
# 言語ランタイムの導入を Dockerfile へ委譲する＝この YAML は編集不要でどのスタックでも動く。
# ゲートは push 前フック（make install-hooks）と CI で二重化する（CIが最終防波堤）。

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # 整合性監査。雛形の audit-consistency.sh は純 bash/grep でツールチェーン不要のため
  # 素の runner で実行する（最速・完全中立）。
  # 注意: 層(2)構造監査・層(3)スキーマdrift をスタックツールや DB で実装した場合は、
  #       この audit ジョブを下の lint/test と同じ devcontainer 方式に寄せ、
  #       drift 検査に DB が要るなら services: ブロックを足すこと。
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make audit-all

  # 静的解析（ゼロ警告ゲート）。Makefile 雛形は未実装だと exit 1 で失敗する＝実装するまで赤。
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: devcontainers/ci@v0.3
        with:
          runCmd: make lint
          push: never

  # 全テスト実行。Makefile 雛形は未実装だと exit 1 で失敗する＝テストを用意するまで赤（fail-closed）。
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: devcontainers/ci@v0.3
        with:
          runCmd: make test
          push: never

  # カバレッジのフロア検証（一方向ラチェット。quality-gates.md §5）。雛形は未実装だと赤（fail-closed）。
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: devcontainers/ci@v0.3
        with:
          runCmd: make coverage
          push: never

  # 依存パッケージの脆弱性監査（security.md）。雛形は未実装だと赤（fail-closed）。
  deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: devcontainers/ci@v0.3
        with:
          runCmd: make audit-deps
          push: never

  # 要件↔テストのトレーサビリティ（未カバー要件・妥当性欠落・批准後改変を検出。詳細: docs/rules/requirements.md）。
  # スクリプトは純 bash だが、マーカー走査設定は Makefile の req-coverage ターゲットが与える。
  req-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: devcontainers/ci@v0.3
        with:
          runCmd: make req-coverage
          push: never

  # 秘密のコミット防止（security.md）。作業ツリーを gitleaks でスキャンする（スタック非依存）。
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: gitleaks (working tree)
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.18.4 detect --source=/repo --no-git --redact --no-banner
